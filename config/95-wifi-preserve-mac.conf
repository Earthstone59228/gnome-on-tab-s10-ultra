# 2026-09-25: this MediaTek driver cannot take a MAC change without the down/up cycle that
# wlan_keepup_shim.so forbids, and random-MAC scans failed with EFAULT (-14). Leave the MAC exactly as the kernel has it.
[connection.22-wifi-mac-addr]
match-device=type:wifi
wifi.cloned-mac-address=preserve

[device]
wifi.scan-rand-mac-address=no
